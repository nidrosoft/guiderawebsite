<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join a trip on Guidera</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0b12; color: #f8f8f8; padding: 24px;
      }
      .card {
        max-width: 420px; width: 100%; text-align: center;
        background: #16161f; border: 1px solid rgba(255,255,255,0.08);
        border-radius: 20px; padding: 32px 24px;
      }
      .logo { font-size: 40px; margin-bottom: 8px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: rgba(248,248,248,0.7); line-height: 1.5; margin: 0 0 24px; font-size: 15px; }
      .btn {
        display: block; width: 100%; text-decoration: none; font-weight: 700; font-size: 16px;
        padding: 14px 20px; border-radius: 12px; margin-bottom: 12px;
      }
      .btn-primary { background: #3FC39E; color: #0b0b12; }
      .btn-store { background: rgba(255,255,255,0.06); color: #f8f8f8; border: 1px solid rgba(255,255,255,0.1); }
      .code { font-size: 13px; color: rgba(248,248,248,0.5); margin-top: 16px; }
      .code strong { color: #f8f8f8; letter-spacing: 1px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">✈️</div>
      <h1>You're invited to a trip</h1>
      <p>Open this invite in the Guidera app to view the trip and join your travel group.</p>
      <a id="openApp" class="btn btn-primary" href="#">Open in Guidera</a>
      <a class="btn btn-store" href="https://apps.apple.com/app/guidera/id0000000000">Get it on the App Store</a>
      <a class="btn btn-store" href="https://play.google.com/store/apps/details?id=com.guidera.one">Get it on Google Play</a>
      <p class="code" id="codeLine"></p>
    </div>
    <script>
      // Path is /invite/<code>
      var parts = location.pathname.split("/").filter(Boolean);
      var code = parts[parts.length - 1] || "";
      if (code && code !== "invite") {
        var deep = "guidera://invite/" + encodeURIComponent(code);
        document.getElementById("openApp").setAttribute("href", deep);
        document.getElementById("codeLine").innerHTML =
          'Invite code: <strong>' + code + '</strong> — enter it in the app if the button doesn\'t open it.';
        // Try to open the app automatically once.
        setTimeout(function () { window.location.href = deep; }, 400);
      }
    </script>
  </body>
</html>
